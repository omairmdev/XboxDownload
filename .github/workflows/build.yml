name: Build

# Run it by hand:  GitHub → Actions → "Build" → "Run workflow".
# Builds are attached to the run as artifacts (Actions → the run → Artifacts).
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

# Least privilege: jobs only get read access unless they declare more.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  validate:
    name: Build & checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore XboxDownload.sln

      - name: Build (Release)
        run: dotnet build XboxDownload.sln -c Release --no-restore

      - name: Fail on known-vulnerable NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list XboxDownload.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '^\s+>' vuln.txt; then
            echo "::error::Vulnerable NuGet packages found (see log above)"
            exit 1
          fi

      - name: Shell scripts parse
        run: |
          bash -n XboxDownload/Scripts/publish.sh
          bash -n XboxDownload/Scripts/run_xboxdownload.sh

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and Linux packages can be cross-built from Linux.
          - { name: windows-x64,   rid: win-x64,     runner: ubuntu-latest }
          - { name: windows-arm64, rid: win-arm64,   runner: ubuntu-latest }
          - { name: linux-x64,     rid: linux-x64,   runner: ubuntu-latest }
          - { name: linux-arm64,   rid: linux-arm64, runner: ubuntu-latest }
          # The macOS .app bundle needs sips/iconutil, which only exist on macOS.
          - { name: macos-x64,     rid: osx-x64,     runner: macos-latest }
          - { name: macos-arm64,   rid: osx-arm64,   runner: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Publish ${{ matrix.rid }}
        run: bash XboxDownload/Scripts/publish.sh "${{ matrix.rid }}" "${{ matrix.name }}"

      - name: Checksum
        working-directory: XboxDownload/Scripts/Release
        shell: bash
        run: |
          set -euo pipefail
          ls -l
          if command -v sha256sum >/dev/null; then sha256sum XboxDownload-*.zip > "SHA256SUMS-${{ matrix.name }}.txt";
          else shasum -a 256 XboxDownload-*.zip > "SHA256SUMS-${{ matrix.name }}.txt"; fi
          cat "SHA256SUMS-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: XboxDownload-${{ matrix.name }}
          path: |
            XboxDownload/Scripts/Release/XboxDownload-*.zip
            XboxDownload/Scripts/Release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    # Only for version tags, e.g.  git tag v3.0.0.66 && git push origin v3.0.0.66
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed only to create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$TAG"
